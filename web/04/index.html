<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ESSE ERA O PREÇO · Barras + linhas</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="../menu.css" />
  </head>
  <body>
    <div class="pagina">
      <header class="topo">
        <h1>ESSE ERA O PREÇO DE <span id="produto" class="produto">1KG DE CARNE</span></h1>
      </header>

      <main>
        <div class="grafico-area">
          <div id="grafico" class="grafico"></div>
          <p id="carregando" class="aviso">Carregando dados…</p>
          <p id="erro" class="aviso erro oculto" role="alert"></p>
        </div>

        <div class="legenda">
          <span class="leg-item">
            <i class="leg-barra-brasil" aria-hidden="true"></i>
            BARRAS · BRASIL
          </span>
          <span class="leg-item">
            <i class="leg-linha-uf" aria-hidden="true"></i>
            LINHAS · UFs
          </span>
          <span class="leg-item">ESCALA LINEAR · 0–50</span>
        </div>

        <section class="ufs" aria-label="Unidades da federação">
          <div id="listaUfs" class="ufs-lista"></div>
        </section>
      </main>
    </div>

    <div id="tooltip" class="tooltip oculto" role="tooltip"></div>
    <script type="module" src="app.js"></script>
    <script type="module" src="../menu.js"></script>
  </body>
</html>
